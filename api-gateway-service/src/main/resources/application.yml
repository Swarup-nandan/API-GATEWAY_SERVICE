server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  datasource:
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:c2VjdXJlLXNpZ25pbmcta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ni1iaXQ=}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

rate-limit:
  capacity: 20          # max tokens (burst size)
  refill-tokens: 20     # tokens added per refill window
  refill-period-seconds: 60

logging:
  level:
    com.gateway: INFO
    org.springframework.security: WARN
